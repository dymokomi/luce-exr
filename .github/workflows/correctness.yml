name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-exr
      - id: pins
        run: |
          echo "base=$(cat luce-exr/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
          echo "luce=$(cat luce-exr/bootstrap/LUCE)" >> "$GITHUB_OUTPUT"
          echo "raster=$(cat luce-exr/bootstrap/RASTER)" >> "$GITHUB_OUTPUT"
          echo "compress=$(cat luce-exr/bootstrap/COMPRESS)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - name: Check out the pinned library packages
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          while read -r name revision; do
            revision=${revision%$'\r'}
            [ -n "$name" ] || continue
            git init -q "$name"
            git -C "$name" fetch -q --depth 1 "https://github.com/dymokomi/$name.git" "$revision"
            git -C "$name" checkout -q --detach FETCH_HEAD
          done < luce-exr/bootstrap/PACKAGES
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-raster
          ref: ${{ steps.pins.outputs.raster }}
          path: luce-raster
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-compress
          ref: ${{ steps.pins.outputs.compress }}
          path: luce-compress
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Install independent Cryptomatte oracles
        working-directory: luce-exr
        run: |
          python3 -m venv build/test-env
          build/test-env/bin/python -m pip install -r tests/requirements.txt
      - name: Build pinned compilers
        working-directory: luce-exr
        run: build/test-env/bin/python tools/bootstrap.py
      - run: ./test.sh
        working-directory: luce-exr
